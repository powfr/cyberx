<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46f4ff"/><stop offset="1" stop-color="#0078ff"/>
    </linearGradient>
    <linearGradient id="gy" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ff52dc"/><stop offset="1" stop-color="#a414ff"/>
    </linearGradient>
    <!-- C : cercle centre (222,262) r=158, ouvert à droite -->
    <path id="C" d="M 349.8 169.1 A 158 158 0 1 0 366.3 326.3" fill="none" stroke-linecap="round"/>
    <!-- Y : bras gauche traverse le haut du C, tige traversée par le bas du C -->
    <path id="Y" d="M 240 62 L 344 262 L 448 62 M 344 262 L 344 452" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <clipPath id="topZone"><rect x="0" y="0" width="512" height="215"/></clipPath>
    <clipPath id="botZone"><rect x="290" y="236" width="222" height="276"/></clipPath>
    <!-- Haut : le Y passe DEVANT le C (on creuse le C) -->
    <mask id="cutC" maskUnits="userSpaceOnUse">
      <rect width="512" height="512" fill="#fff"/>
      <g clip-path="url(#topZone)"><use href="#Y" stroke="#000" stroke-width="88"/></g>
    </mask>
    <!-- Bas : le C passe DEVANT le Y (on creuse le Y) -->
    <mask id="cutY" maskUnits="userSpaceOnUse">
      <rect width="512" height="512" fill="#fff"/>
      <g clip-path="url(#botZone)"><use href="#C" stroke="#000" stroke-width="92"/></g>
    </mask>
  </defs>
  <g mask="url(#cutC)"><use href="#C" stroke="url(#gc)" stroke-width="62"/></g>
  <g mask="url(#cutY)"><use href="#Y" stroke="url(#gy)" stroke-width="56"/></g>
</svg>
