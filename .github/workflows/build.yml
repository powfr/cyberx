# Compile CyberX sur Windows à chaque modification envoyée sur GitHub.
# Si la version de Cargo.toml n'a pas encore été publiée, crée automatiquement
# la Release correspondante avec cyberx.exe : c'est là que CyberX va chercher ses mises à jour.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compiler
        run: cargo build --release
      - name: Garder l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: cyberx-windows
          path: target/release/cyberx.exe
      - name: Publier la nouvelle version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "La version $V est déjà publiée."
          else
            gh release create "v$V" target/release/cyberx.exe --title "CyberX $V" --generate-notes
          fi
