# Compile CyberX sur Windows à chaque modification.
# Quand une version est étiquetée (ex. v0.4.0), publie cyberx.exe dans les Releases :
# c'est là que CyberX va chercher ses mises à jour.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compiler
        run: cargo build --release
      - name: Garder l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: cyberx-windows
          path: target/release/cyberx.exe
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/cyberx.exe
          generate_release_notes: true
